<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox vs Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Flexbox and Grid</h1></header>
  <main>
    <section>
      <h2>Flexbox Example</h2>
      <div class="flex-layout"><div>Home</div><div>About</div><div>Contact</div></div>
    </section>
    <section>
      <h2>Grid Example</h2>
      <div class="grid-layout"><div>One</div><div>Two</div><div>Three</div><div>Four</div></div>
    </section>
  </main>
  <footer>Flexbox is useful for one direction. Grid is useful for rows and columns.</footer>
</body>
</html>
