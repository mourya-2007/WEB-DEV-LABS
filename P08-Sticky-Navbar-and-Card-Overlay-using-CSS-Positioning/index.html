<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky Navbar and Card Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <strong>My Website</strong>
    <nav><a href="#home">Home</a><a href="#cards">Cards</a></nav>
  </header>
  <main id="home">
    <h1>CSS Positioning</h1>
    <p>The navigation stays at the top. The cards overlap using CSS positioning.</p>
    <section class="card-area" id="cards">
      <div class="card card-back">Card One</div>
      <div class="card card-front">Card Two</div>
    </section>
    <p>Scroll down to check the sticky navigation bar.</p>
    <div class="extra">More page content</div>
  </main>
</body>
</html>
